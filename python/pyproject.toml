[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "far-lio-python"
version = "0.1.0"
description = "CPU Python reference implementation of FAR-LIO's LiDAR odometry pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "tyro>=0.8"]

[project.scripts]
far-lio-python = "far_lio_python.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["far_lio_python*"]
